<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini AI Studio - Real-Time Chat & Media Engine (by xhk Talha)</title>
  <meta name="description" content="Gemini AI Studio real-time chat, photo generator, video animation generator, microphone speech transcription, and voice assistant created by xhk Talha." />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Marked Markdown Parser CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- Highlight.js Syntax Highlighter CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    body {
      background-color: #131314;
      color: #e3e3e3;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
    }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col overflow-hidden selection:bg-indigo-600 selection:text-white">

  <!-- TOP HEADER NAVBAR -->
  <header class="h-16 border-b border-white/10 bg-[#131314]/90 backdrop-blur-md px-4 flex items-center justify-between sticky top-0 z-30 select-none">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 via-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <svg class="w-4 h-4 text-white animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
        </div>
        <span class="font-bold text-lg tracking-tight text-white flex items-center gap-1.5 font-display">
          Gemini <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400">Studio</span>
        </span>
      </div>

      <!-- App Owner Badge -->
      <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-gradient-to-r from-indigo-500/10 via-purple-500/10 to-pink-500/10 border border-indigo-500/30 text-indigo-300 text-xs font-semibold shadow-xs">
        <span class="text-amber-400">👑</span>
        <span>Owner: <strong class="text-white">xhk Talha</strong></span>
      </div>
    </div>

    <!-- Model Selector & Search Toggle -->
    <div class="hidden md:flex items-center gap-2">
      <select id="model-select" class="bg-[#1e1f22] border border-white/10 text-xs text-gray-200 rounded-xl px-3 py-1.5 focus:outline-none font-medium">
        <option value="gemini-3.8-flash" selected>Gemini 3.8 Flash (Fast & Smart)</option>
        <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro (Deep Reasoning)</option>
        <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite (Ultra Speed)</option>
        <option value="gemini-3.1-flash-image">Gemini Vision & Multimodal</option>
      </select>

      <button id="grounding-btn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-white/10 bg-white/5 text-gray-400 hover:text-white transition-all text-xs font-medium">
        <span>🌐 Google Search</span>
      </button>
    </div>

    <!-- Quick Action Buttons -->
    <div class="flex items-center gap-2">
      <button id="toggle-canvas-btn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 text-gray-200 text-xs font-medium">
        <span>⚙️ Canvas Preview</span>
      </button>
    </div>
  </header>

  <!-- MAIN CHAT WORKSPACE -->
  <div class="flex-1 flex overflow-hidden relative">
    
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-[#131314] relative">
      
      <!-- Welcome Screen -->
      <div id="welcome-screen" class="flex-1 overflow-y-auto p-6 flex flex-col items-center justify-center max-w-4xl mx-auto w-full text-center space-y-6">
        <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-blue-600 via-purple-600 to-indigo-500 flex items-center justify-center shadow-2xl">
          <svg class="w-8 h-8 text-white animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
        </div>

        <div class="space-y-2">
          <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-semibold">
            <span>Created & Owned by</span>
            <strong class="text-white underline">xhk Talha</strong>
          </div>
          <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-white font-display">
            Hello, <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400">Creator</span>
          </h1>
          <p class="text-gray-400 text-xs max-w-md mx-auto">
            Aaj aap kya seekhna, photo/video generate karna ya code karna chahte hain? Experience full real-time Gemini AI by xhk Talha.
          </p>
        </div>
      </div>

      <!-- Messages Stream List -->
      <div id="messages-container" class="flex-1 overflow-y-auto hidden">
        <div id="messages-list" class="space-y-1 pb-4"></div>
      </div>

      <!-- CHAT INPUT BAR -->
      <div class="p-4 max-w-4xl mx-auto w-full sticky bottom-0 z-20">
        <div class="relative rounded-3xl border border-white/10 bg-[#1e1f22]/90 backdrop-blur-xl shadow-2xl p-3 space-y-2">
          
          <textarea id="chat-textarea" rows="1" placeholder="Ask Gemini anything, upload an image, or speak into microphone..." class="w-full bg-transparent text-gray-100 placeholder-gray-500 text-sm resize-none focus:outline-none px-2 py-1 leading-relaxed max-h-40"></textarea>

          <div class="flex items-center justify-between pt-1">
            <div class="flex items-center gap-2">
              
              <!-- Microphone Button -->
              <button id="mic-btn" class="p-2 rounded-xl text-indigo-400 hover:text-white hover:bg-white/5" title="Record Speech Microphone">
                🎙️ Mic
              </button>

              <!-- Photo Gen Toggle -->
              <button id="toggle-photo-mode" class="px-2.5 py-1 rounded-xl border border-white/10 bg-white/5 text-gray-400 hover:text-white text-xs font-semibold">
                🎨 Photo Gen
              </button>

              <!-- Video Gen Toggle -->
              <button id="toggle-video-mode" class="px-2.5 py-1 rounded-xl border border-white/10 bg-white/5 text-gray-400 hover:text-white text-xs font-semibold">
                🎬 Video Gen
              </button>

            </div>

            <!-- Send Button -->
            <button id="send-btn" class="p-2.5 rounded-2xl bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white font-semibold text-xs shadow-lg">
              Send Message
            </button>
          </div>
        </div>

        <div class="text-[11px] text-center text-gray-500 mt-2 font-mono">
          Gemini AI Studio • Developed & Owned by xhk Talha
        </div>
      </div>
    </main>

    <!-- RIGHT CANVAS PREVIEW PANEL -->
    <div id="canvas-panel" class="w-full lg:w-[480px] border-l border-white/10 bg-[#18191c] hidden flex-col z-30">
      <div class="h-12 border-b border-white/10 px-4 flex items-center justify-between bg-[#1e1f22]">
        <div class="flex items-center gap-2 text-xs font-semibold text-white">
          <span class="w-2 h-2 rounded-full bg-indigo-500 animate-ping"></span>
          <span>Live Canvas Artifact</span>
        </div>
        <button id="close-canvas-btn" class="p-1.5 text-gray-400 hover:text-white">✕</button>
      </div>
      <div class="flex-1 bg-[#131314]">
        <iframe id="canvas-iframe" class="w-full h-full border-none" sandbox="allow-scripts"></iframe>
      </div>
    </div>

  </div>

  <script>
    // JS Logic for API calls, chat streaming, mic recording, photo/video gen
    const chatTextarea = document.getElementById('chat-textarea');
    const sendBtn = document.getElementById('send-btn');
    const welcomeScreen = document.getElementById('welcome-screen');
    const messagesContainer = document.getElementById('messages-container');
    const messagesList = document.getElementById('messages-list');

    sendBtn.addEventListener('click', () => {
      const text = chatTextarea.value.trim();
      if (!text) return;
      chatTextarea.value = '';
      welcomeScreen.classList.add('hidden');
      messagesContainer.classList.remove('hidden');

      // Append Message
      const userDiv = document.createElement('div');
      userDiv.className = 'py-4 px-6 bg-[#131314] text-sm text-gray-100 font-sans border-b border-white/5';
      userDiv.innerText = text;
      messagesList.appendChild(userDiv);
    });
  </script>
</body>
</html>
